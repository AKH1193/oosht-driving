name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Bundle the game page into the app
        run: python3 tools/build_page.py web/game.html app/src/main/assets/www/index.html

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        id: gradle1
        continue-on-error: true
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Gradle (retry if the download timed out)
        if: steps.gradle1.outcome == 'failure'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build the APK
        run: gradle assembleRelease -PversionCode=${{ github.run_number }} --no-daemon --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk oosht-driving.apk

      - uses: actions/upload-artifact@v4
        with:
          name: oosht-driving-apk
          path: oosht-driving.apk

      - name: Publish the download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Oosht Driving 1.0.${{ github.run_number }}
          body: Install oosht-driving.apk on your Android phone.
          files: oosht-driving.apk
          make_latest: true
