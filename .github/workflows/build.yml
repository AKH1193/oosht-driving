name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Bundle the game page into the app
        run: python3 tools/build_page.py web/game.html app/src/main/assets/www/index.html

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Download Gradle 8.9 (with retries and mirrors)
        run: |
          for url in \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip \
            https://github.com/gradle/gradle-distributions/releases/download/v8.9.0/gradle-8.9-bin.zip \
            https://downloads.gradle.org/distributions/gradle-8.9-bin.zip; do
            for attempt in 1 2 3; do
              echo "Trying $url (attempt $attempt)"
              if curl -fL --connect-timeout 30 --max-time 600 --retry 3 --retry-all-errors --retry-delay 10 -o gradle.zip "$url" && unzip -q gradle.zip -d "$HOME/gradle-dist"; then
                echo "$HOME/gradle-dist/gradle-8.9/bin" >> "$GITHUB_PATH"
                exit 0
              fi
              rm -f gradle.zip; sleep 15
            done
          done
          echo "Could not download Gradle from any mirror"; exit 1

      - name: Build the APK
        run: |
          gradle --version
          for attempt in 1 2 3; do
            gradle assembleRelease -PversionCode=${{ github.run_number }} --no-daemon --stacktrace && exit 0
            echo "Build attempt $attempt failed, retrying in 20 seconds"
            sleep 20
          done
          exit 1

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk oosht-driving.apk

      - uses: actions/upload-artifact@v4
        with:
          name: oosht-driving-apk
          path: oosht-driving.apk

      - name: Publish the download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Oosht Driving 1.0.${{ github.run_number }}
          body: Install oosht-driving.apk on your Android phone.
          files: oosht-driving.apk
          make_latest: true
